[tool.poetry]
name = "cima-backend"
version = "0.1.0"
description = "Backend FastAPI de CIMA - Escuela de Sostenibilidad e Inclusión Bolívar"
authors = ["Equipo CIMA <sostenibilidad@segurosbolivar.com>"]
readme = "README.md"
packages = [{ include = "app" }]

# Dependencias ancladas a versión EXACTA (sin ^, ~, *) conforme al estándar de la organización.
# Deben resolverse desde el repositorio institucional JFrog.
[tool.poetry.dependencies]
python = "3.12.*"
fastapi = "0.143.0"
uvicorn = "0.54.0"
sqlalchemy = "2.1.4"
pydantic = "2.14.0"
pydantic-settings = "2.15.0"
alembic = "1.20.0"
asyncpg = "0.32.0"
pgvector = "0.5.1"
passlib = "1.7.4"
python-multipart = "0.0.32"
httpx = "0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
hypothesis = "6.168.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["tests/*", "app/*/models.py", "app/*/dto.py", "app/common/config.py", "alembic/*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
