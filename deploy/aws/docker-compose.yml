# Servicios de CIMA en el servidor EC2 de la hackatón.
#
# Se ejecuta desde /opt/cima con:
#   docker compose -f deploy/docker-compose.yml --project-directory /opt/cima up -d --build
#
# - `db` no publica puertos: solo la ve el backend por la red interna de Docker.
# - El backend escucha en el puerto 80 del servidor; el grupo de seguridad solo
#   deja entrar a CloudFront (ver crear-infra.sh).
# - Los secretos salen de /opt/cima/.env y /opt/cima/backend.env, que genera
#   actualizar.sh en el servidor y nunca se versionan.
services:
  db:
    # pgvector 0.8.7 sobre PostgreSQL 15.19: la misma imagen que se usa en local,
    # fijada por su digest.
    image: pgvector/pgvector@sha256:88164492558c9773a1e17a8305abaca7863e05b3d8bbcdb792774890a2047e06
    restart: unless-stopped
    environment:
      POSTGRES_USER: cima_app
      POSTGRES_DB: cima
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en /opt/cima/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cima_app -d cima"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    image: cima-backend:hackaton
    restart: unless-stopped
    env_file: ./backend.env
    environment:
      DATABASE_URL: postgresql+asyncpg://cima_app:${POSTGRES_PASSWORD}@db:5432/cima
      LEARNING_MEDIA_DIR: /app/media
    volumes:
      - ./media:/app/media:ro
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
